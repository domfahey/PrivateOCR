<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PrivateOCR</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-app-bar">
      <div class="app-bar-content">
        <h1 class="title">PrivateOCR</h1>
        <div class="spacer"></div>
        <button id="settingsBtn" class="md-btn-icon" title="Settings / About">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path
              d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.09-.76-1.71-1.06l-.35-2.5c-.05-.24-.24-.41-.48-.41h-4c-.24 0-.43.17-.47.41l-.35 2.5c-.63.3-1.2.66-1.72 1.06l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.08.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.09.76 1.71 1.06l.35 2.5c.05.24.24.41.48.41h4c.24 0 .43-.17.47-.41l.35-2.5c.63-.3 1.2-.66 1.72-1.06l2.49 1c.22.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"
            />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="action-row">
        <button id="screenshotBtn" class="md-btn md-btn-filled">
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M14.12 4l1.83 2H20v12H4V6h4.05l1.83-2h4.24M15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2zm-3 7c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3m0-2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z"
              />
            </svg>
          </span>
          <span class="label">Capture Tab</span>
        </button>
        <button id="regionBtn" class="md-btn md-btn-tonal">
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M17 15h2V7c0-1.1-.9-2-2-2H9v2h8v8zM7 17V1H5v4H1v2h4v10c0 1.1.9 2 2 2h10v4h2v-4h4v-2H7z"
              />
            </svg>
          </span>
          <span class="label">Select Region</span>
        </button>
        <button id="pasteBtn" class="md-btn md-btn-tonal" title="Paste image from clipboard">
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"
              />
            </svg>
          </span>
          <span class="label">Paste</span>
        </button>
      </div>

      <div class="import-section">
        <div id="dropZone" class="drop-zone">
          <svg class="drop-icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path
              d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6zm5-6v3h2v-3h3l-4-4-4 4h3z"
            />
          </svg>
          <span class="drop-text">Drop image here</span>
          <span class="drop-subtext">or</span>
          <label class="file-picker-label">
            <input
              type="file"
              id="fileInput"
              accept="image/png,image/jpeg,image/webp,image/gif,image/bmp"
              hidden
            />
            <span class="md-btn md-btn-tonal small">Choose File</span>
          </label>
        </div>
      </div>

      <div class="status-container">
        <div class="progress-track" id="progressTrack">
          <div class="progress-indicator" id="progressIndicator"></div>
        </div>
        <div class="status-row">
          <div id="status" class="status-text">Ready</div>
          <span id="confidenceBadge" class="confidence-badge" style="display: none">
            <span id="confidenceValue">--</span>%
          </span>
          <button
            id="cancelBtn"
            class="md-btn md-btn-text error"
            style="display: none; padding: 0 8px; min-width: auto; height: 24px; font-size: 12px"
          >
            Stop
          </button>
        </div>
      </div>

      <div id="contentArea" class="content-area split-view">
        <div id="imagePreviewContainer" class="preview-container">
          <div class="preview-toolbar">
            <button id="imgZoomOutBtn" class="md-btn-icon small" title="Zoom Out">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>
            <button id="imgZoomFitBtn" class="md-btn-icon small" title="Fit to View">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path
                  d="M5 5h14v14H5V5zm0-2c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5z"
                />
                <path d="M7 7h10v10H7z" opacity=".3" />
              </svg>
            </button>
            <button id="imgZoomInBtn" class="md-btn-icon small" title="Zoom In">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
              </svg>
            </button>
          </div>
          <div class="image-scroll-wrapper">
            <div id="emptyImageState" class="empty-state">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
                <path
                  d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"
                  opacity="0.3"
                />
              </svg>
              <span>No image captured</span>
            </div>
            <img id="previewImage" alt="Captured content" style="display: none" />
          </div>
        </div>

        <div class="text-field-wrapper">
          <div class="editor-toolbar">
            <button
              id="toggleImageBtn"
              class="md-btn-icon small active"
              title="Toggle Source Image"
            >
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path
                  d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"
                />
              </svg>
            </button>

            <div
              class="zoom-controls"
              style="border-left: 1px solid #e0e0e0; padding-left: 8px; margin-left: 8px"
            >
              <button id="textZoomOutBtn" class="md-btn-icon small" title="Decrease Font Size">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path
                    d="M20 19h-7.8l-.96-2.4h-6.6l-.94 2.4H2l6.55-16h3.2L20 19zM7.67 13.4h4.66L10 5.7 7.67 13.4zM22 12h-4v-2h4v2z"
                  />
                </svg>
              </button>
              <button id="textZoomInBtn" class="md-btn-icon small" title="Increase Font Size">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path
                    d="M20 19h-7.8l-.96-2.4h-6.6l-.94 2.4H2l6.55-16h3.2L20 19zM7.67 13.4h4.66L10 5.7 7.67 13.4zM22 12h-4v-2h4v2h-2v4h2v2h2v-2h4v-2h-4z"
                  />
                </svg>
              </button>
            </div>

            <div class="spacer"></div>

            <button id="copyBtn" class="md-btn md-btn-text small" title="Copy to Clipboard">
              <span class="icon">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path
                    d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"
                  />
                </svg>
              </span>
              <span>Copy</span>
            </button>
          </div>
          <textarea
            id="output"
            class="md-text-field"
            placeholder="Captured text will appear here..."
          ></textarea>
        </div>
      </div>
    </main>

    <script src="../vendor/tesseract/tesseract.min.js"></script>
    <script src="popup.js" type="module"></script>
  </body>
</html>
